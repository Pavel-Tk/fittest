  <g id="text_22">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5e636b" transform="translate(20.16 276.268406)">Pre-registered rule does not hold: forces not sig. better than gen 0; rel. energy regresses vs static; ECE</text>
