   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5e636b" transform="translate(20.16 300.968406)">x: generation / cumulative Transition1x labels. Static = same triage/oracle and DFT budget, no breeding or</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5e636b" transform="translate(20.16 313.318406)">pruning. CIs: 95% paired reaction bootstrap over eval.</text>
