[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fittest"
version = "0.1.0"
description = "A collective of agents that decides which MLIP to trust, where, and repairs it where none can be."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pavel Tkachyk" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "mcp>=1.20,<2",  # the fittest-mcp console script must work from a plain `uvx --from git+...`
]

[project.scripts]
fittest-mcp = "fittest.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Pavel-Tk/fittest"

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "ase>=3.22"]
mcp = ["mcp>=1.20,<2", "anyio>=4.4"]
# real model agents on CPU/GPU for local mode (Orb needs its own env: set FITTEST_ORB_PYTHON)
models = ["nvalchemi-toolkit[mace,aimnet,ase] @ git+https://github.com/NVIDIA/nvalchemi-toolkit.git@0.3.0-rc"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["fittest*"]

[tool.setuptools.package-data]
fittest = ["snapshots/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
